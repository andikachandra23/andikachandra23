<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lateral Thinking — Studi Kasus Pengayaan</title>
<style>
  /* ── RESET & BASE ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy:    #0B0F2A;
    --navy2:   #141937;
    --navy3:   #1C2444;
    --navy4:   #243060;
    --blue:    #3B4FD8;
    --blue2:   #5B72FF;
    --amber:   #F5A623;
    --amber2:  #FFD080;
    --green:   #10B981;
    --red:     #EF4444;
    --white:   #FFFFFF;
    --light:   #E2E8F0;
    --mid:     #8899BB;
    --sidebar-w: 280px;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--navy);
    color: var(--light);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── HEADER ── */
  header {
    background: var(--navy2);
    border-bottom: 1px solid var(--navy4);
    padding: 0 2rem;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-left { display: flex; align-items: center; gap: 1rem; }

  .header-badge {
    background: var(--amber);
    color: var(--navy);
    font-size: 0.65rem;
    font-weight: 800;
    letter-spacing: 0.08em;
    padding: 0.2rem 0.6rem;
    border-radius: 4px;
    text-transform: uppercase;
  }

  .header-title {
    font-family: Georgia, serif;
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--white);
  }

  .header-title span { color: var(--amber); }

  .progress-info {
    font-size: 0.78rem;
    color: var(--mid);
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .progress-dots { display: flex; gap: 4px; }

  .progress-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--navy4);
    transition: background 0.3s;
  }

  .progress-dot.done { background: var(--amber); }
  .progress-dot.active { background: var(--blue2); }

  /* ── LAYOUT ── */
  .app { display: flex; flex: 1; overflow: hidden; height: calc(100vh - 60px); }

  /* ── SIDEBAR ── */
  aside {
    width: var(--sidebar-w);
    background: var(--navy2);
    border-right: 1px solid var(--navy4);
    overflow-y: auto;
    flex-shrink: 0;
    padding: 1rem 0;
  }

  .sidebar-group {
    margin-bottom: 0.5rem;
  }

  .sidebar-group-label {
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--mid);
    text-transform: uppercase;
    padding: 0.5rem 1.2rem 0.3rem;
  }

  .case-btn {
    display: flex;
    align-items: flex-start;
    gap: 0.75rem;
    width: 100%;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0.7rem 1.2rem;
    text-align: left;
    transition: background 0.15s;
    border-left: 3px solid transparent;
  }

  .case-btn:hover { background: var(--navy3); }

  .case-btn.active {
    background: var(--navy3);
    border-left-color: var(--amber);
  }

  .case-btn.active .case-btn-num { color: var(--amber); }

  .case-btn.completed .case-btn-num::after {
    content: " ✓";
    color: var(--green);
    font-size: 0.7rem;
  }

  .case-btn-num {
    font-size: 0.7rem;
    font-weight: 700;
    color: var(--mid);
    margin-top: 0.15rem;
    flex-shrink: 0;
    font-family: monospace;
    letter-spacing: 0.05em;
  }

  .case-btn-info { flex: 1; min-width: 0; }

  .case-btn-name {
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--light);
    line-height: 1.3;
    margin-bottom: 0.2rem;
  }

  .case-btn.active .case-btn-name { color: var(--white); }

  .case-btn-tag {
    font-size: 0.68rem;
    color: var(--mid);
    display: flex;
    align-items: center;
    gap: 0.3rem;
  }

  .tag-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .sidebar-divider {
    height: 1px;
    background: var(--navy4);
    margin: 0.5rem 1.2rem;
  }

  /* ── MAIN CONTENT ── */
  main {
    flex: 1;
    overflow-y: auto;
    padding: 2.5rem 3rem;
    max-width: 900px;
  }

  /* ── WELCOME SCREEN ── */
  .welcome {
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 70vh;
    max-width: 600px;
  }

  .welcome-eyebrow {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--amber);
    margin-bottom: 1.2rem;
  }

  .welcome h1 {
    font-family: Georgia, serif;
    font-size: 2.6rem;
    font-weight: 700;
    line-height: 1.15;
    color: var(--white);
    margin-bottom: 1rem;
  }

  .welcome h1 em {
    font-style: normal;
    color: var(--amber);
  }

  .welcome-desc {
    font-size: 1rem;
    line-height: 1.7;
    color: var(--mid);
    margin-bottom: 2rem;
  }

  .how-it-works {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    margin-bottom: 2rem;
  }

  .how-card {
    background: var(--navy3);
    border: 1px solid var(--navy4);
    border-radius: 10px;
    padding: 1.1rem;
  }

  .how-card-num {
    font-size: 0.68rem;
    font-weight: 800;
    letter-spacing: 0.1em;
    color: var(--amber);
    text-transform: uppercase;
    margin-bottom: 0.4rem;
  }

  .how-card-title {
    font-size: 0.88rem;
    font-weight: 700;
    color: var(--white);
    margin-bottom: 0.3rem;
  }

  .how-card-desc {
    font-size: 0.78rem;
    color: var(--mid);
    line-height: 1.5;
  }

  .start-hint {
    font-size: 0.85rem;
    color: var(--mid);
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .start-hint::before {
    content: "←";
    color: var(--amber);
    font-size: 1rem;
  }

  /* ── CASE CONTENT ── */
  .case-content { display: none; }
  .case-content.visible { display: block; }

  .case-header {
    margin-bottom: 2.5rem;
    padding-bottom: 1.5rem;
    border-bottom: 1px solid var(--navy4);
  }

  .case-eyebrow {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 1rem;
    flex-wrap: wrap;
  }

  .case-group-tag {
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0.25rem 0.65rem;
    border-radius: 4px;
  }

  .case-industry-tag {
    font-size: 0.72rem;
    color: var(--mid);
    display: flex;
    align-items: center;
    gap: 0.3rem;
  }

  .case-country {
    font-size: 0.72rem;
    color: var(--mid);
  }

  .case-title {
    font-family: Georgia, serif;
    font-size: 2rem;
    font-weight: 700;
    color: var(--white);
    line-height: 1.2;
    margin-bottom: 0.6rem;
  }

  .case-subtitle {
    font-size: 0.9rem;
    color: var(--mid);
    line-height: 1.6;
    max-width: 680px;
  }

  /* ── SECTION ── */
  .section {
    margin-bottom: 2rem;
    animation: fadeUp 0.4s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .section-label {
    font-size: 0.65rem;
    font-weight: 800;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--amber);
    margin-bottom: 0.75rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .section-label::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--navy4);
  }

  .context-box {
    background: var(--navy3);
    border: 1px solid var(--navy4);
    border-radius: 10px;
    padding: 1.25rem 1.5rem;
    font-size: 0.9rem;
    line-height: 1.75;
    color: var(--light);
  }

  /* ── ASSUMPTION REVEAL ── */
  .assumption-intro {
    font-size: 0.85rem;
    color: var(--mid);
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .assumption-intro .hint-icon {
    background: var(--amber);
    color: var(--navy);
    font-size: 0.7rem;
    font-weight: 800;
    padding: 0.15rem 0.45rem;
    border-radius: 4px;
  }

  .assumptions-grid {
    display: grid;
    gap: 0.6rem;
  }

  .assumption-item {
    background: var(--navy3);
    border: 1px solid var(--navy4);
    border-radius: 8px;
    padding: 0.9rem 1.1rem;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }

  .assumption-item:hover:not(.revealed) {
    border-color: var(--blue);
    background: var(--navy4);
  }

  .assumption-item.revealed {
    border-color: var(--red);
    background: rgba(239, 68, 68, 0.06);
    cursor: default;
  }

  .assumption-text {
    font-size: 0.88rem;
    color: var(--light);
    line-height: 1.5;
    display: flex;
    align-items: flex-start;
    gap: 0.6rem;
  }

  .assumption-icon {
    font-size: 0.9rem;
    flex-shrink: 0;
    margin-top: 0.05rem;
  }

  .assumption-hidden-hint {
    font-size: 0.72rem;
    color: var(--mid);
    margin-top: 0.5rem;
    font-style: italic;
    display: none;
  }

  .assumption-item:not(.revealed) .assumption-hidden-hint { display: block; }
  .assumption-item.revealed .assumption-hidden-hint { display: none; }

  .assumption-revealed-label {
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--red);
    text-transform: uppercase;
    margin-bottom: 0.3rem;
    display: none;
  }

  .assumption-item.revealed .assumption-revealed-label { display: block; }

  .reveal-counter {
    font-size: 0.78rem;
    color: var(--mid);
    margin-top: 0.75rem;
    text-align: right;
  }

  .reveal-all-btn {
    font-size: 0.75rem;
    color: var(--blue2);
    background: none;
    border: none;
    cursor: pointer;
    text-decoration: underline;
    margin-left: 0.5rem;
  }

  /* ── LATERAL QUESTION ── */
  .lateral-question-box {
    background: linear-gradient(135deg, var(--navy4) 0%, var(--navy3) 100%);
    border: 1px solid var(--blue);
    border-radius: 12px;
    padding: 1.5rem;
    position: relative;
  }

  .lq-label {
    font-size: 0.68rem;
    font-weight: 800;
    letter-spacing: 0.1em;
    color: var(--blue2);
    text-transform: uppercase;
    margin-bottom: 0.75rem;
  }

  .lq-text {
    font-family: Georgia, serif;
    font-size: 1.05rem;
    font-style: italic;
    color: var(--white);
    line-height: 1.6;
  }

  .lq-source {
    font-size: 0.75rem;
    color: var(--mid);
    margin-top: 0.75rem;
  }

  /* ── TECHNIQUES ── */
  .techniques-grid {
    display: grid;
    gap: 0.75rem;
  }

  .technique-card {
    background: var(--navy3);
    border: 1px solid var(--navy4);
    border-radius: 10px;
    padding: 1.1rem 1.25rem;
  }

  .technique-header {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 0.6rem;
  }

  .technique-badge {
    font-size: 0.7rem;
    font-weight: 800;
    letter-spacing: 0.05em;
    padding: 0.2rem 0.6rem;
    border-radius: 4px;
    flex-shrink: 0;
    text-transform: uppercase;
  }

  .technique-name {
    font-size: 0.88rem;
    font-weight: 700;
    color: var(--white);
  }

  .technique-desc {
    font-size: 0.85rem;
    color: var(--light);
    line-height: 1.6;
  }

  /* ── WHAT HAPPENED ── */
  .what-happened {
    background: var(--navy3);
    border: 1px solid var(--navy4);
    border-radius: 10px;
    padding: 1.25rem 1.5rem;
  }

  .stat-row {
    display: flex;
    gap: 1.5rem;
    margin-bottom: 1rem;
    flex-wrap: wrap;
  }

  .stat-item { text-align: center; }

  .stat-num {
    font-family: Georgia, serif;
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--amber);
    line-height: 1;
    margin-bottom: 0.25rem;
  }

  .stat-label {
    font-size: 0.72rem;
    color: var(--mid);
    line-height: 1.3;
  }

  .stat-divider {
    width: 1px;
    background: var(--navy4);
    align-self: stretch;
  }

  .happened-text {
    font-size: 0.88rem;
    color: var(--light);
    line-height: 1.75;
  }

  /* ── LESSON ── */
  .lesson-box {
    background: linear-gradient(135deg, rgba(245,166,35,0.12) 0%, rgba(245,166,35,0.04) 100%);
    border: 1px solid rgba(245,166,35,0.35);
    border-radius: 12px;
    padding: 1.4rem 1.5rem;
  }

  .lesson-icon {
    font-size: 1.3rem;
    margin-bottom: 0.6rem;
  }

  .lesson-text {
    font-size: 0.9rem;
    color: var(--light);
    line-height: 1.75;
  }

  .lesson-text strong { color: var(--amber); }

  /* ── SPECIAL: FAILURE TAG ── */
  .failure-warning {
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.3);
    border-radius: 8px;
    padding: 0.75rem 1.1rem;
    font-size: 0.82rem;
    color: #FCA5A5;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 1.5rem;
  }

  /* ── QUIZ ── */
  .quiz-section {
    background: var(--navy2);
    border: 1px solid var(--navy4);
    border-radius: 14px;
    padding: 1.75rem;
    margin-top: 2.5rem;
  }

  .quiz-header {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 1.25rem;
  }

  .quiz-badge {
    background: var(--blue);
    color: var(--white);
    font-size: 0.65rem;
    font-weight: 800;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0.25rem 0.65rem;
    border-radius: 4px;
  }

  .quiz-title {
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--white);
  }

  .quiz-question {
    font-size: 0.9rem;
    color: var(--light);
    line-height: 1.6;
    margin-bottom: 1.1rem;
  }

  .quiz-options {
    display: grid;
    gap: 0.5rem;
    margin-bottom: 1rem;
  }

  .quiz-option {
    background: var(--navy3);
    border: 1px solid var(--navy4);
    border-radius: 8px;
    padding: 0.75rem 1rem;
    cursor: pointer;
    font-size: 0.85rem;
    color: var(--light);
    text-align: left;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .quiz-option:hover:not(:disabled) {
    border-color: var(--blue);
    background: var(--navy4);
    color: var(--white);
  }

  .quiz-option.correct {
    border-color: var(--green);
    background: rgba(16,185,129,0.1);
    color: var(--white);
  }

  .quiz-option.wrong {
    border-color: var(--red);
    background: rgba(239,68,68,0.08);
    color: #FCA5A5;
  }

  .quiz-option.neutral-reveal {
    opacity: 0.5;
  }

  .quiz-option-letter {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--navy4);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.72rem;
    font-weight: 700;
    flex-shrink: 0;
    transition: background 0.15s;
  }

  .quiz-option.correct .quiz-option-letter { background: var(--green); }
  .quiz-option.wrong .quiz-option-letter { background: var(--red); }

  .quiz-feedback {
    font-size: 0.85rem;
    line-height: 1.6;
    padding: 0.9rem 1.1rem;
    border-radius: 8px;
    display: none;
  }

  .quiz-feedback.correct {
    background: rgba(16,185,129,0.1);
    border: 1px solid rgba(16,185,129,0.3);
    color: #6EE7B7;
    display: block;
  }

  .quiz-feedback.wrong {
    background: rgba(239,68,68,0.08);
    border: 1px solid rgba(239,68,68,0.25);
    color: #FCA5A5;
    display: block;
  }

  .quiz-reset {
    font-size: 0.78rem;
    color: var(--mid);
    background: none;
    border: none;
    cursor: pointer;
    text-decoration: underline;
    margin-top: 0.75rem;
    display: none;
  }

  .quiz-reset.visible { display: inline-block; }

  /* ── NAV FOOTER ── */
  .case-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 3rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--navy4);
  }

  .nav-btn {
    background: var(--navy3);
    border: 1px solid var(--navy4);
    color: var(--light);
    font-size: 0.82rem;
    font-weight: 600;
    padding: 0.6rem 1.2rem;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .nav-btn:hover {
    border-color: var(--amber);
    color: var(--amber);
  }

  .nav-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  .nav-btn:disabled:hover {
    border-color: var(--navy4);
    color: var(--light);
  }

  .case-position {
    font-size: 0.78rem;
    color: var(--mid);
  }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--navy2); }
  ::-webkit-scrollbar-thumb { background: var(--navy4); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--mid); }

  /* ── RESPONSIVE ── */
  @media (max-width: 768px) {
    aside { display: none; }
    main { padding: 1.5rem; }
    .how-it-works { grid-template-columns: 1fr; }
    .stat-row { gap: 1rem; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <span class="header-badge">Pengayaan</span>
    <span class="header-title">Lateral Thinking — <span>Studi Kasus</span></span>
  </div>
  <div class="progress-info">
    <span id="progress-text">0 / 9 selesai</span>
    <div class="progress-dots" id="progress-dots"></div>
  </div>
</header>

<div class="app">
  <aside id="sidebar"></aside>
  <main id="main-content"></main>
</div>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────────

const GROUPS = [
  { id: "g1", label: "Bisnis Digital & Platform", color: "#3B4FD8", bg: "rgba(59,79,216,0.15)" },
  { id: "g2", label: "Industri Konvensional", color: "#10B981", bg: "rgba(16,185,129,0.15)" },
  { id: "g3", label: "Konteks Indonesia & Asia Tenggara", color: "#F5A623", bg: "rgba(245,166,35,0.15)" },
  { id: "g4", label: "Kasus Gagal — Diskusi Kritis", color: "#EF4444", bg: "rgba(239,68,68,0.15)" },
];

const CASES = [
  // ── GROUP 1 ──
  {
    id: "canva", group: "g1", num: "1.1",
    name: "Canva",
    industry: "Desain Grafis", country: "🇦🇺 Australia",
    subtitle: "Bagaimana desain profesional menjadi milik semua orang — bukan hanya yang terlatih.",
    context: "Desain grafis dikuasai software profesional seperti Adobe Photoshop dan Illustrator. Untuk membuat desain yang layak, seseorang butuh: lisensi mahal, pelatihan teknis berbulan-bulan, atau menyewa desainer profesional. Industri ini secara implisit menyatakan bahwa desain bagus adalah domain orang-orang terlatih.",
    assumptions: [
      "Desain profesional membutuhkan software yang kompleks",
      "Pengguna non-desainer tidak bisa menghasilkan output berkualitas",
      "Perangkat desain harus diinstal secara lokal",
      "Kurva belajar yang panjang adalah harga yang wajar untuk dibayar",
    ],
    lateralQ: {
      text: "\"Bagaimana kalau siapapun bisa mendesain hal apapun dalam hitungan menit, tanpa perlu belajar desain?\"",
      source: "Melanie Perkins, founder — terinspirasi saat mengajar software desain kepada mahasiswa yang frustasi"

let currentCase = null;
let completed = new Set();
let quizAnswered = new Set();

// ── INIT ─────────────────────────────────────────────────────────────────────
function init() {
  buildSidebar();
  buildProgressDots();
  showWelcome();
}

function buildProgressDots() {
  const container = document.getElementById("progress-dots");
  CASES.forEach((c, i) => {
    const dot = document.createElement("div");
    dot.className = "progress-dot";
    dot.id = `dot-${c.id}`;
    container.appendChild(dot);
  });
}

function updateProgress() {
  const text = document.getElementById("progress-text");
  text.textContent = `${completed.size} / ${CASES.length} selesai`;
  CASES.forEach(c => {
    const dot = document.getElementById(`dot-${c.id}`);
    if (!dot) return;
    dot.className = "progress-dot" + (completed.has(c.id) ? " done" : (currentCase === c.id ? " active" : ""));
  });
}

function buildSidebar() {
  const sidebar = document.getElementById("sidebar");
  sidebar.innerHTML = "";
  GROUPS.forEach(group => {
    const groupCases = CASES.filter(c => c.group === group.id);
    const div = document.createElement("div");
    div.className = "sidebar-group";

    const label = document.createElement("div");
    label.className = "sidebar-group-label";
    label.textContent = group.label;
    div.appendChild(label);

    groupCases.forEach(c => {
      const btn = document.createElement("button");
      btn.className = "case-btn" + (currentCase === c.id ? " active" : "") + (completed.has(c.id) ? " completed" : "");
      btn.id = `sidebar-btn-${c.id}`;
      btn.onclick = () => loadCase(c.id);
      btn.innerHTML = `
        <span class="case-btn-num">${c.num}</span>
        <div class="case-btn-info">
          <div class="case-btn-name">${c.name}</div>
          <div class="case-btn-tag">
            <span class="tag-dot" style="background:${group.color}"></span>
            ${c.industry}
          </div>
        </div>
      `;
      div.appendChild(btn);
    });

    const div2 = document.createElement("div");
    div2.className = "sidebar-divider";
    sidebar.appendChild(div);
    if (group.id !== "g4") sidebar.appendChild(div2);
  });
}

function showWelcome() {
  const main = document.getElementById("main-content");
  main.innerHTML = `
    <div class="welcome">
      <div class="welcome-eyebrow">Materi Pengayaan · Lateral Thinking</div>
      <h1>Studi Kasus <em>Nyata</em><br>dari Dunia Bisnis</h1>
      <p class="welcome-desc">
        Sembilan kasus dari berbagai industri dan negara — termasuk dua kasus
        kegagalan yang mengajarkan hal berbeda dari keberhasilan. Setiap kasus
        dilengkapi mekanik interaktif untuk melatih cara berpikir lateral, bukan sekadar membaca.
      </p>
      <div class="how-it-works">
        <div class="how-card">
          <div class="how-card-num">Langkah 1</div>
          <div class="how-card-title">Bongkar Asumsi</div>
          <div class="how-card-desc">Klik satu per satu untuk membongkar asumsi industri yang dilanggar. Coba tebak dulu sebelum klik.</div>
        </div>
        <div class="how-card">
          <div class="how-card-num">Langkah 2</div>
          <div class="how-card-title">Analisis Teknik</div>
          <div class="how-card-desc">Identifikasi teknik lateral thinking mana yang digunakan dan bagaimana ia bekerja di konteks nyata.</div>
        </div>
        <div class="how-card">
          <div class="how-card-num">Langkah 3</div>
          <div class="how-card-title">Uji Pemahaman</div>
          <div class="how-card-desc">Jawab quiz singkat di akhir setiap kasus untuk mengecek seberapa dalam pemahamanmu.</div>
        </div>
        <div class="how-card">
          <div class="how-card-num">Langkah 4</div>
          <div class="how-card-title">Refleksi Kritis</div>
          <div class="how-card-desc">Dua kasus terakhir adalah kegagalan — baca dengan lebih kritis dan cari pola yang berbeda.</div>
        </div>
      </div>
      <div class="start-hint">Pilih kasus dari sidebar untuk mulai</div>
    </div>
  `;
}

function loadCase(caseId) {
  currentCase = caseId;
  const c = CASES.find(x => x.id === caseId);
  if (!c) return;

  // Update sidebar
  document.querySelectorAll(".case-btn").forEach(btn => btn.classList.remove("active"));
  const activeBtn = document.getElementById(`sidebar-btn-${caseId}`);
  if (activeBtn) activeBtn.classList.add("active");

  updateProgress();

  const group = GROUPS.find(g => g.id === c.group);
  const caseIndex = CASES.findIndex(x => x.id === caseId);

  const main = document.getElementById("main-content");
  main.scrollTop = 0;

  // Build case HTML
  let html = `<div class="case-content visible">`;

  // Header
  html += `
    <div class="case-header">
      <div class="case-eyebrow">
        <span class="case-group-tag" style="background:${group.bg};color:${group.color}">${group.label}</span>
        <span class="case-industry-tag">🏭 ${c.industry}</span>
        <span class="case-country">${c.country}</span>
      </div>
      <h1 class="case-title">${c.name}</h1>
      <p class="case-subtitle">${c.subtitle}</p>
    </div>
  `;

  // Failure warning
  if (c.isFailure) {
    html += `
      <div class="failure-warning">
        ⚠️ <strong>Kasus Kritis:</strong> ${c.failureNote}
      </div>
    `;
  }

  // Context
  html += `
    <div class="section" style="animation-delay:0.05s">
      <div class="section-label">Konteks Industri</div>
      <div class="context-box">${c.context}</div>
    </div>
  `;

  // Assumptions (interactive reveal)
  html += `
    <div class="section" style="animation-delay:0.1s">
      <div class="section-label">Asumsi yang Dilanggar</div>
      <div class="assumption-intro">
        <span class="hint-icon">INTERAKTIF</span>
        Klik setiap asumsi untuk membongkarnya. Coba tebak dulu mana yang paling mengejutkan.
      </div>
      <div class="assumptions-grid" id="assumptions-${c.id}">
  `;
  c.assumptions.forEach((a, i) => {
    html += `
      <div class="assumption-item" id="assum-${c.id}-${i}" onclick="revealAssumption('${c.id}', ${i})">
        <div class="assumption-revealed-label">Asumsi yang tidak pernah dipertanyakan ✗</div>
        <div class="assumption-text">
          <span class="assumption-icon">🔒</span>
          <span>${a}</span>
        </div>
        <div class="assumption-hidden-hint">Klik untuk membongkar asumsi ini</div>
      </div>
    `;
  });
  html += `
      </div>
      <div class="reveal-counter" id="reveal-counter-${c.id}">
        0 / ${c.assumptions.length} terbongkar
        <button class="reveal-all-btn" onclick="revealAll('${c.id}')">Bongkar semua</button>
      </div>
    </div>
  `;

  // Lateral question
  html += `
    <div class="section" style="animation-delay:0.15s">
      <div class="section-label">Pertanyaan Lateral yang Mengubah Segalanya</div>
      <div class="lateral-question-box">
        <div class="lq-label">Pertanyaan Pemantik</div>
        <div class="lq-text">${c.lateralQ.text}</div>
        <div class="lq-source">— ${c.lateralQ.source}</div>
      </div>
    </div>
  `;

  // Techniques
  html += `
    <div class="section" style="animation-delay:0.2s">
      <div class="section-label">Teknik Lateral Thinking yang Teridentifikasi</div>
      <div class="techniques-grid">
  `;
  c.techniques.forEach(t => {
    html += `
      <div class="technique-card">
        <div class="technique-header">
          <span class="technique-badge" style="background:${t.bgColor};color:${t.color}">${t.name}</span>
        </div>
        <div class="technique-desc">${t.desc}</div>
      </div>
    `;
  });
  html += `</div></div>`;

  // What happened
  html += `
    <div class="section" style="animation-delay:0.25s">
      <div class="section-label">Yang Terjadi</div>
      <div class="what-happened">
  `;
  if (c.stats && c.stats.length > 0) {
    html += `<div class="stat-row">`;
    c.stats.forEach((s, i) => {
      if (i > 0) html += `<div class="stat-divider"></div>`;
      html += `
        <div class="stat-item">
          <div class="stat-num">${s.num}</div>
          <div class="stat-label">${s.label}</div>
        </div>
      `;
    });
    html += `</div>`;
  }
  html += `<div class="happened-text">${c.happened}</div></div></div>`;

  // Lesson
  html += `
    <div class="section" style="animation-delay:0.3s">
      <div class="section-label">Pelajaran Utama</div>
      <div class="lesson-box">
        <div class="lesson-icon">${c.lessonIcon}</div>
        <div class="lesson-text">${c.lesson}</div>
      </div>
    </div>
  `;

  // Quiz
  const quizAnsweredAlready = quizAnswered.has(c.id);
  html += `
    <div class="quiz-section">
      <div class="quiz-header">
        <span class="quiz-badge">Quiz</span>
        <span class="quiz-title">Uji Pemahamanmu</span>
      </div>
      <div class="quiz-question">${c.quiz.question}</div>
      <div class="quiz-options" id="quiz-opts-${c.id}">
  `;
  const letters = ["A", "B", "C", "D"];
  c.quiz.options.forEach((opt, i) => {
    html += `
      <button class="quiz-option" id="quiz-opt-${c.id}-${i}"
        onclick="answerQuiz('${c.id}', ${i})"
        ${quizAnsweredAlready ? "disabled" : ""}>
        <span class="quiz-option-letter">${letters[i]}</span>
        ${opt}
      </button>
    `;
  });
  html += `
      </div>
      <div class="quiz-feedback" id="quiz-feedback-${c.id}"></div>
      <button class="quiz-reset" id="quiz-reset-${c.id}" onclick="resetQuiz('${c.id}')">Coba lagi</button>
    </div>
  `;

  // Navigation
  html += `
    <div class="case-nav">
      <button class="nav-btn" onclick="navigateCase(-1)" ${caseIndex === 0 ? "disabled" : ""}>
        ← Kasus Sebelumnya
      </button>
      <span class="case-position">${caseIndex + 1} dari ${CASES.length}</span>
      <button class="nav-btn" onclick="navigateCase(1)" ${caseIndex === CASES.length - 1 ? "disabled" : ""}>
        Kasus Berikutnya →
      </button>
    </div>
  `;

  html += `</div>`;
  main.innerHTML = html;

  // Restore quiz state if already answered
  if (quizAnsweredAlready) {
    // Find which answer was given — re-highlight correct
    highlightCorrect(c.id);
  }

  // Mark complete when fully scrolled or after some time
  setTimeout(() => {
    completed.add(caseId);
    buildSidebar();
    updateProgress();
    // Re-attach active state
    document.querySelectorAll(".case-btn").forEach(btn => btn.classList.remove("active"));
    const btn2 = document.getElementById(`sidebar-btn-${caseId}`);
    if (btn2) btn2.classList.add("active");
  }, 8000);
}

// Reveal assumption
let revealCounts = {};

function revealAssumption(caseId, idx) {
  const item = document.getElementById(`assum-${caseId}-${idx}`);
  if (!item || item.classList.contains("revealed")) return;
  item.classList.add("revealed");

  if (!revealCounts[caseId]) revealCounts[caseId] = 0;
  revealCounts[caseId]++;

  const c = CASES.find(x => x.id === caseId);
  const counter = document.getElementById(`reveal-counter-${caseId}`);
  if (counter) {
    counter.innerHTML = `
      ${revealCounts[caseId]} / ${c.assumptions.length} terbongkar
      <button class="reveal-all-btn" onclick="revealAll('${caseId}')">Bongkar semua</button>
    `;
  }
}

function revealAll(caseId) {
  const c = CASES.find(x => x.id === caseId);
  c.assumptions.forEach((_, i) => revealAssumption(caseId, i));
}

// Quiz
function answerQuiz(caseId, selectedIdx) {
  if (quizAnswered.has(caseId)) return;
  quizAnswered.add(caseId);

  const c = CASES.find(x => x.id === caseId);
  const isCorrect = selectedIdx === c.quiz.correct;

  // Disable all options
  c.quiz.options.forEach((_, i) => {
    const opt = document.getElementById(`quiz-opt-${caseId}-${i}`);
    if (!opt) return;
    opt.disabled = true;
    if (i === c.quiz.correct) {
      opt.classList.add("correct");
    } else if (i === selectedIdx && !isCorrect) {
      opt.classList.add("wrong");
    } else {
      opt.classList.add("neutral-reveal");
    }
  });

  // Show feedback
  const feedback = document.getElementById(`quiz-feedback-${caseId}`);
  if (feedback) {
    feedback.className = `quiz-feedback ${isCorrect ? "correct" : "wrong"}`;
    feedback.innerHTML = `${isCorrect ? "✓ " : "✗ "}${isCorrect ? c.quiz.feedback.correct : c.quiz.feedback.wrong}`;
  }

  // Show reset
  const reset = document.getElementById(`quiz-reset-${caseId}`);
  if (reset) reset.classList.add("visible");
}

function highlightCorrect(caseId) {
  const c = CASES.find(x => x.id === caseId);
  const opt = document.getElementById(`quiz-opt-${caseId}-${c.quiz.correct}`);
  if (opt) opt.classList.add("correct");
}

function resetQuiz(caseId) {
  quizAnswered.delete(caseId);
  const c = CASES.find(x => x.id === caseId);
  c.quiz.options.forEach((_, i) => {
    const opt = document.getElementById(`quiz-opt-${caseId}-${i}`);
    if (!opt) return;
    opt.disabled = false;
    opt.className = "quiz-option";
  });
  const feedback = document.getElementById(`quiz-feedback-${caseId}`);
  if (feedback) { feedback.className = "quiz-feedback"; feedback.innerHTML = ""; }
  const reset = document.getElementById(`quiz-reset-${caseId}`);
  if (reset) reset.classList.remove("visible");
}

function navigateCase(direction) {
  const caseIndex = CASES.findIndex(x => x.id === currentCase);
  const nextIndex = caseIndex + direction;
  if (nextIndex >= 0 && nextIndex < CASES.length) {
    loadCase(CASES[nextIndex].id);
  }
}

// ── START ─────────────────────────────────────────────────────────────────────
init();
</script>
